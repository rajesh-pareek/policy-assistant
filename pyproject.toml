
[project]
name = "pratham-policy-assistant"
version = "0.1.0"
description = "Pratham AI Policy Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.5",
    "google-genai>=3.2.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "python-multipart>=0.0.33",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "policy_assistant"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

